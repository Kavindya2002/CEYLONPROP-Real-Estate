<div class="container mt-5 p-4 bg-white rounded shadow-sm">
  <h3 class="text-center mb-4">Generate Invoice</h3>

  <form (ngSubmit)="onSubmit()" #invoiceForm="ngForm">
    <div class="mb-3">
      <label>Date</label>
      <input type="date" class="form-control" required [(ngModel)]="invoice.invoiceDate" name="invoiceDate">
    </div>

    <div class="mb-3">
      <label>Customer Name</label>
      <input type="text" class="form-control" required [(ngModel)]="invoice.customerName" name="customerName">
    </div>

    <div class="mb-3">
      <label>Product</label>
      <input type="text" class="form-control" required [(ngModel)]="invoice.product" name="product">
    </div>

    <div class="mb-3">
      <label>Quantity</label>
      <input type="number" class="form-control" required min="1" [(ngModel)]="invoice.qty" name="qty">
    </div>

    <div class="mb-3">
      <label>Discount (%)</label>
      <input type="number" class="form-control" [(ngModel)]="invoice.discount" name="discount">
    </div>

    <div class="mb-3">
      <label>Total</label>
      <input type="number" class="form-control" [(ngModel)]="invoice.totalAmount" name="totalAmount" readonly>
    </div>

    <button type="submit" class="btn btn-primary w-100">Generate Invoice</button>
  </form>
</div>
